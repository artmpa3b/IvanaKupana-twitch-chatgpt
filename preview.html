<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Velorah Preview</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500&display=swap" rel="stylesheet">
    <style>
      :root {
        --font-display: 'Instrument Serif', serif;
        --font-body: 'Inter', sans-serif;
        --background: 201 100% 13%;
        --foreground: 0 0% 100%;
        --muted-foreground: 240 4% 66%;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        font-family: var(--font-body);
        background: hsl(var(--background));
        color: hsl(var(--foreground));
      }
      main { position: relative; min-height: 100vh; overflow: hidden; }
      video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 0; }
      nav {
        position: relative; z-index: 10; max-width: 80rem; margin: 0 auto;
        display: flex; justify-content: space-between; align-items: center;
        padding: 1.5rem 2rem;
      }
      .logo { font-family: var(--font-display); font-size: 1.875rem; text-decoration: none; color: inherit; }
      .links { display: none; gap: 2rem; align-items: center; }
      .links a { text-decoration: none; font-size: .875rem; color: hsl(var(--muted-foreground)); transition: color .25s ease; }
      .links a.active, .links a:hover { color: hsl(var(--foreground)); }
      .hero {
        position: relative; z-index: 10; min-height: calc(100vh - 88px);
        display: flex; flex-direction: column; justify-content: center; align-items: center;
        text-align: center; padding: 90px 1.5rem 10rem;
      }
      h1 {
        font-family: var(--font-display); font-size: clamp(3rem, 8vw, 6rem);
        font-weight: 400; line-height: .95; letter-spacing: -2.46px; margin: 0; max-width: 80rem;
        animation: fade-rise .8s ease-out both;
      }
      em { font-style: normal; color: hsl(var(--muted-foreground)); }
      p {
        max-width: 42rem; margin-top: 2rem; font-size: clamp(1rem, 2vw, 1.125rem);
        line-height: 1.65; color: hsl(var(--muted-foreground));
        animation: fade-rise .8s ease-out .2s both;
      }
      .liquid-glass {
        background: rgba(255,255,255,.01); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
        box-shadow: inset 0 1px 1px rgba(255,255,255,.1); border: none; position: relative; overflow: hidden;
        color: hsl(var(--foreground)); cursor: pointer; transition: transform .3s ease;
      }
      .liquid-glass:hover { transform: scale(1.03); }
      .liquid-glass::before {
        content: ''; position: absolute; inset: 0; border-radius: inherit; padding: 1.4px;
        background: linear-gradient(180deg, rgba(255,255,255,.45) 0%, rgba(255,255,255,.15) 20%, rgba(255,255,255,0) 40%, rgba(255,255,255,0) 60%, rgba(255,255,255,.15) 80%, rgba(255,255,255,.45) 100%);
        -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
        -webkit-mask-composite: xor; mask-composite: exclude; pointer-events: none;
      }
      .nav-btn { border-radius: 999px; padding: .625rem 1.5rem; font-size: .875rem; }
      .hero-btn { border-radius: 999px; padding: 1.25rem 3.5rem; font-size: 1rem; margin-top: 3rem; animation: fade-rise .8s ease-out .4s both; }
      @keyframes fade-rise { from {opacity:0; transform: translateY(24px);} to {opacity:1; transform: translateY(0);} }
      @media (min-width: 768px){ .links{display:flex;} }
    </style>
  </head>
  <body>
    <main>
      <video autoplay loop muted playsinline src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260314_131748_f2ca2a28-fed7-44c8-b9a9-bd9acdd5ec31.mp4"></video>
      <nav>
        <a href="#" class="logo">Velorah<sup style="font-size:.75rem">®</sup></a>
        <div class="links">
          <a class="active" href="#">Home</a><a href="#">Studio</a><a href="#">About</a><a href="#">Journal</a><a href="#">Reach Us</a>
        </div>
        <button class="liquid-glass nav-btn">Begin Journey</button>
      </nav>
      <section class="hero">
        <h1>Where <em>dreams</em> rise <em>through the silence.</em></h1>
        <p>We're designing tools for deep thinkers, bold creators, and quiet rebels. Amid the chaos, we build digital spaces for sharp focus and inspired work.</p>
        <button class="liquid-glass hero-btn">Begin Journey</button>
      </section>
    </main>
  </body>
</html>
